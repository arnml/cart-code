[project]
name = "smtl-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.8.4",
    "llama-index>=0.14.19",
    "openai>=2.30.0",
    "anthropic>=0.28.0",
    "tiktoken>=0.12.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "voyageai>=0.2.0",
    "seaborn>=0.13.2",
    "pandas>=3.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.7",
    "mypy>=1.15",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
